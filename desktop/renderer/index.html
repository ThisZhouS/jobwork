<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>求职背调工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 图标 sprite：线形图标，统一 1.7 描边 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/><path d="M3 13h18"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3.5" width="11" height="17" rx="1.5"/><path d="M15 9.5h4.5V20.5H15"/><path d="M7.5 7.5h4M7.5 11.5h4M7.5 15.5h4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9.5a3.5 3.5 0 0 1 .5 6.95"/><path d="M8.5 21h7"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5V8.5h5"/><path d="M8.5 12.5h7M8.5 16.5h4.5"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-10.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3.5 6.5h17M6.5 12h11M10 17.5h4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 8.2v.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17.2 6.7 20l1.1-5.9L3.5 10l5.9-.8z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z"/><path d="M12 9.5V14M12 16.6v.2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10"/><path d="M19 5 11 13"/><path d="M18 14.5v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-10a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 14.5a2 2 0 0 1-2 2H9l-4.5 3.5V5.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 8.5 4.5L12 12 3.5 7.5z"/><path d="m3.5 12 8.5 4.5L20.5 12"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></symbol>
  </defs>
</svg>

<div id="app">
  <!-- 侧栏 -->
  <aside id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#04111f" stroke-width="2.4"><path d="m12 3 8.5 4.5L12 12 3.5 7.5z"/><path d="m3.5 12 8.5 4.5L20.5 12"/></svg></span>
      <span class="brand-text"><b>求职背调</b><em>岗位与公司分析</em></span>
    </a>
    <nav id="nav">
      <a href="#/" data-route="/"><svg class="ni"><use href="#i-home"/></svg>概览</a>
      <a href="#/jobs" data-route="/jobs"><svg class="ni"><use href="#i-briefcase"/></svg>岗位</a>
      <a href="#/companies" data-route="/companies"><svg class="ni"><use href="#i-building"/></svg>公司</a>
      <a href="#/skills" data-route="/skills"><svg class="ni"><use href="#i-cloud"/></svg>技能词云</a>
      <a href="#/resume" data-route="/resume"><svg class="ni"><use href="#i-file"/></svg>简历</a>
    </nav>
    <div class="sidebar-foot">
      <a href="#/settings" data-route="/settings" class="foot-link"><svg class="ni"><use href="#i-cog"/></svg>设置</a>
      <div class="user">
        <span class="avatar">职</span>
        <span class="user-text"><b>本地工作台</b><em id="db-status">连接中…</em></span>
      </div>
    </div>
  </aside>

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <!-- 内容 -->
  <main id="main"><div id="page"></div></main>
</div>

<!-- 对话 -->
<button id="chat-fab" title="运行与问答"><svg class="ni" style="width:19px;height:19px"><use href="#i-chat"/></svg><span class="chat-dot" id="chat-badge" hidden></span></button>
<div id="chat-drawer" hidden>
  <div class="chat-head">
    <span class="chat-title"><svg class="ni"><use href="#i-layers"/></svg>运行与问答</span>
    <button class="btn btn-ghost btn-sm" id="chat-close">收起</button>
  </div>
  <div class="chat-body" id="chat-log"></div>
  <div class="chat-input" id="chat-questions"></div>
</div>

<script src="app.js"></script>
</body>
</html>
