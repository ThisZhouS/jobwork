<div class="frame" id="app">
  <!-- HUD 顶栏 -->
  <header class="hud">
    <a class="brand" href="#/" title="回到概览">
      <span class="brand-sigil"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 8.5 4.5L12 12 3.5 7.5z"/><path d="m3.5 12 8.5 4.5L20.5 12"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></svg></span>
      <span class="brand-text"><b>SWARM / TALENT</b><em>求职背调工作台 · 模块化 agent</em></span>
    </a>
    <div class="hud-stats" id="hud-stats">
      <div class="hud-stat"><span>DB</span><b id="hud-db">—</b></div>
      <div class="hud-stat"><span>JOBS</span><b id="hud-jobs">—</b></div>
      <div class="hud-stat"><span>COMPANIES</span><b id="hud-companies">—</b></div>
      <div class="hud-stat"><span>MODULES</span><b id="hud-modules">—</b></div>
      <div class="hud-stat"><span>MODELS</span><b id="hud-models">—</b></div>
    </div>
    <div class="hud-clock"><b id="hud-clock">--:--:--</b><span class="hud-tag">LOCAL.ONLY</span></div>
  </header>

  <!-- 编号页签 -->
  <nav class="tabs" id="nav">
    <a class="tab" style="--tab:var(--pink)" href="#/" data-route="/"><span class="tab-no">01</span><span class="tab-cn">概览</span><span class="tab-en">OVERVIEW</span></a>
    <a class="tab" style="--tab:var(--cyan)" href="#/jobs" data-route="/jobs"><span class="tab-no">02</span><span class="tab-cn">岗位</span><span class="tab-en">JOBS</span></a>
    <a class="tab" style="--tab:var(--teal)" href="#/companies" data-route="/companies"><span class="tab-no">03</span><span class="tab-cn">公司</span><span class="tab-en">COMPANIES</span></a>
    <a class="tab" style="--tab:var(--purple)" href="#/skills" data-route="/skills"><span class="tab-no">04</span><span class="tab-cn">技能</span><span class="tab-en">SKILLS</span></a>
    <a class="tab" style="--tab:var(--amber)" href="#/resume" data-route="/resume"><span class="tab-no">05</span><span class="tab-cn">简历</span><span class="tab-en">RESUME</span></a>
    <a class="tab" style="--tab:var(--orange)" href="#/modules" data-route="/modules"><span class="tab-no">06</span><span class="tab-cn">模块</span><span class="tab-en">MODULES</span></a>
    <a class="tab" style="--tab:var(--dim)" href="#/settings" data-route="/settings"><span class="tab-no">07</span><span class="tab-cn">设置</span><span class="tab-en">CONFIG</span></a>
  </nav>

  <div class="subbar">
    <div class="crumb" id="crumb"></div>
    <div class="topbar-right" id="topbar-right"></div>
  </div>

  <main id="page"></main>

  <footer class="frame-foot">
    <span class="foot-brand">SWARM // TALENT INTELLIGENCE</span>
    <span class="foot-line"></span>
    <span>LOCAL-FIRST · 采集 → 背调 → 评分 → 适配 → 定制</span>
    <span class="foot-right" id="foot-modules">—</span>
  </footer>
</div>

<!-- 对话 -->
<button id="chat-fab" title="运行与问答"><svg class="ni" style="width:19px;height:19px"><use href="#i-chat"/></svg><span class="chat-dot" id="chat-badge" hidden></span></button>
<div id="chat-drawer" hidden>
  <div class="chat-head">
    <span class="chat-title"><svg class="ni"><use href="#i-layers"/></svg>运行与问答</span>
    <button class="btn btn-ghost btn-sm" id="chat-close">收起</button>
  </div>
  <div class="chat-body" id="chat-log"></div>
  <div class="chat-input" id="chat-questions"></div>
</div>

<script src="swarm.js"></script>
<script src="app.js"></script>
</body>
</html>
