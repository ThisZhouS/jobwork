name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python tools/check_secrets.py
      - run: uv run ruff check .
      - run: uv run mypy
      - name: test
        id: test
        run: |
          set -o pipefail
          uv run pytest -q --cov --cov-report=term-missing --junitxml=pytest.xml 2>&1 | tee pytest.log
      - name: annotate test failures
        if: steps.test.outcome == 'failure'
        run: uv run python tools/ci_annotate.py pytest.xml pytest.log
