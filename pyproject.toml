[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-crawler"
version = "0.3.0"
description = "岗位采集 / JD 结构化 / 公司背调 / PostgreSQL 元数据与向量存储"
requires-python = ">=3.10"
dependencies = [
    # StealthySession 所需的反爬栈（curl_cffi / patchright / playwright 等）由 fetchers extra 提供
    "scrapling[fetchers]==0.4.8",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10,<2",
]

[project.scripts]
boss-crawler = "boss_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["boss_crawler*"]

[tool.setuptools.package-data]
boss_crawler = ["stealth.js", "defaults/*.json"]
"boss_crawler.store" = ["schema_app.sql"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["desktop/dist*", "build", ".state", "scripts/research"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["boss_crawler"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["boss_crawler"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async def 测试自动识别，同步测试不受影响
asyncio_mode = "auto"
