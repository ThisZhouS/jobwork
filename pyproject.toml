[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-crawler"
version = "0.3.0"
description = "BOSS直聘 岗位采集 / JD 结构化 / 天眼查背调 / PostgreSQL 元数据与向量存储"
requires-python = ">=3.10"
dependencies = [
    "scrapling==0.4.8",
    "patchright>=1.64",
    "browserforge",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
boss-crawler = "boss_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["boss_crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async def 测试自动识别，同步测试不受影响
asyncio_mode = "auto"
